<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recall Deck - AQA GCSE Geography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #eceff1;
      --surface: #fbfcfc;
      --ink: #15212b;
      --muted: #5b6874;
      --line: #d0d7dc;
      --accent: #0c6ba8;
      --accent-ink: #ffffff;
      --good: #17744f;
      --bad: #b4262f;
      --track: #dde3e7;
      --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #11181e; --surface: #19232b; --ink: #e8edf0; --muted: #94a2ad; --line: #2c3a45;
        --accent: #4ba2f0; --accent-ink: #04121a; --good: #4fc596; --bad: #f0707a; --track: #26333d;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #11181e; --surface: #19232b; --ink: #e8edf0; --muted: #94a2ad; --line: #2c3a45;
      --accent: #4ba2f0; --accent-ink: #04121a; --good: #4fc596; --bad: #f0707a; --track: #26333d;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
      padding-block: 20px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-family: var(--display); font-weight: 700; font-size: 1.75rem; letter-spacing: -0.02em; margin: 0; }
    .subject-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .subj-btn {
      font-family: var(--mono); font-size: 0.85rem; padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
    }
    .subj-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
    .filter-bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    select {
      font: 400 0.9rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
      border-radius: 6px; padding: 8px 12px; max-width: 360px; cursor: pointer; width: 100%;
    }
    nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    nav button {
      background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
      font: 500 0.95rem var(--body); padding: 10px 14px 9px; cursor: pointer; white-space: nowrap;
    }
    nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 28px 24px;
      min-height: 260px; display: flex; flex-direction: column; gap: 18px; cursor: pointer; user-select: none;
    }
    .topic { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .q { font-family: var(--display); font-weight: 500; font-size: 1.4rem; line-height: 1.3; margin: 0; }
    .ans { border-top: 1px dashed var(--line); padding-top: 16px; font-size: 1.05rem; color: var(--ink); }
    .hint { margin-top: auto; font-size: 0.82rem; color: var(--muted); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      font: 600 1rem var(--body); padding: 12px 16px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink); cursor: pointer; text-align: center;
    }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.miss { color: var(--bad); border-color: var(--bad); }
    .btn.hit { color: var(--good); border-color: var(--good); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .panel h2 { font-family: var(--display); font-size: 1.2rem; margin: 0; }
    .unit-h { font-family: var(--display); font-size: 1.15rem; margin: 18px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; color: var(--accent); }
    .note-item { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
    .note-item b { font-family: var(--display); font-size: 1rem; display: block; margin-bottom: 4px; }
    .note-item ul { margin: 4px 0 0; padding-left: 1.2em; color: var(--muted); font-size: 0.95rem; }
    .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .opt { display: flex; gap: 10px; text-align: left; width: 100%; font: 400 0.95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; }
    .opt:hover:not(:disabled) { border-color: var(--accent); }
    .opt.right { border-color: var(--good); background: rgba(23, 116, 79, 0.1); }
    .opt.wrong { border-color: var(--bad); background: rgba(180, 38, 47, 0.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Recall Deck</h1>
      <div class="subject-picker" id="subjects"></div>
    </header>
    <nav role="tablist" id="tabs"></nav>
    <main id="view"></main>
  </div>

  <script>
    (function () {
      var currentSubj = 'geo';
      var currentUnit = 'all';
      var tab = 'study';
      var flipped = false;
      var qIdx = 0;
      var quizIdx = 0;
      var quizSelected = null;
      var quizScore = 0;

      var DATA = {
        geo: {
          title: "AQA GCSE Geography (Paper 1 & Paper 2)",
          units: [
            {
              id: "g1",
              name: "Unit 1: The Challenge of Natural Hazards",
              cards: [
                { q: "What is a natural hazard?", a: "A natural event that has the potential to cause loss of life, injury, or property damage." },
                { q: "What is the difference between constructive and destructive plate margins?", a: "Constructive: plates move apart (magma rises to form shield volcanoes). Destructive: plates collide (heavy oceanic plate subducts under continental plate, forming composite volcanoes and deep trenches)." },
                { q: "What is the primary scale used to measure earthquake magnitude?", a: "The Moment Magnitude Scale (or Richter scale)." },
                { q: "How do tropical storms form?", a: "Sea temperature above 26.5°C, converging winds near the ocean surface, and rapid rising warm moist air creating intense low pressure." }
              ],
              notes: [
                { t: "Tectonic Hazards & Plate Boundaries", points: ["Conservative margins: Plates slide past each other horizontally (e.g., San Andreas Fault); friction causes intense earthquakes with no volcanic activity.", "Primary effects of earthquakes: ground shaking, building collapse, infrastructure destruction. Secondary effects: tsunamis, fires, disease, homelessness.", "Management strategies: Monitoring (seismometers, tiltmeters), Prediction (historical data), Protection (aseismic buildings), Planning (evacuation drills)."] },
                { t: "Weather Hazards & Climate Change", points: ["Global atmospheric circulation: Warm air rises at the Equator (low pressure, high rainfall), moves toward poles, sinks at 30°N/S (high pressure, deserts).", "Typhoon Haiyan (2013) case study: 6,300 deaths, storm surges up to 5m, Tacloban destroyed. Immediate aid: food packs, medical missions. Long-term aid: 'Cash for Work' programs.", "Climate change evidence: ice cores, tree rings, historical records, retreat of glaciers. Mitigation: carbon capture, renewable energy, international agreements."] }
              ],
              quiz: [
                { q: "At which plate margin do plates move towards each other, resulting in subduction?", opts: ["Constructive", "Destructive", "Conservative", "Passive"], ans: 1 }
              ]
            },
            {
              id: "g2",
              name: "Unit 2: The Living World & Ecosystems",
              cards: [
                { q: "What is an ecosystem?", a: "A biotic community of living organisms interacting with the abiotic (non-living) components of their environment." },
                { q: "What are the key nutrient cycles in a tropical rainforest?", a: "Rapid nutrient cycling via litter, biomass, and soil. Biomass holds most nutrients due to quick decomposition and uptake." },
                { q: "What causes hot desertification?", a: "Climate change, overgrazing, over-cultivation, and deforestation leading to degraded, infertile soils." }
              ],
              notes: [
                { t: "Tropical Rainforests", points: ["Characteristics: hot, wet climate (2000mm+ annual rainfall), high biodiversity, distinct strata (emergents, canopy, understory, shrub layer).", "Deforestation causes: logging, mineral extraction (gold), commercial agriculture (cattle ranching, soy), road building (Trans-Amazonian Highway).", "Sustainable management: selective logging, ecotourism, debt-for-nature swaps, international agreements (FSC)."] },
                { t: "Hot Deserts", points: ["Characteristics: arid (<250mm annual rainfall), extreme temperature fluctuations, sparse specialized vegetation (cacti, xerophytes).", "Opportunities in the Thar Desert: mineral extraction (gypsum, feldspar), energy production (solar parks, wind farms), tourism, commercial irrigation farming (Indira Gandhi Canal).", "Challenges: extreme heat, water scarcity, poor accessibility across vast sandy terrain."] }
              ],
              quiz: [
                { q: "Where are most nutrients stored in a tropical rainforest ecosystem?", opts: ["In the soil", "In the litter layer", "In the biomass (living plants/animals)", "Dissolved in groundwater"], ans: 2 }
              ]
            },
            {
              id: "g3",
              name: "Unit 3: Physical Landscapes in the UK (Coasts & Rivers)",
              cards: [
                { q: "What is longshore drift?", a: "The transport of sediment along a coastline caused by waves approaching the shore at an angle (swash) and retreating straight back down (backwash)." },
                { q: "What is hard engineering vs soft engineering?", a: "Hard engineering uses man-made structures (e.g. seawalls) to absorb or deflect wave energy. Soft engineering works with natural processes (e.g. beach nourishment)." },
                { q: "What is a hydrograph?", a: "A graph showing river discharge over time following a rainfall event, featuring lag time and peak discharge." }
              ],
              notes: [
                { t: "Coastal Landscapes", points: ["Erosion processes: hydraulic action, abrasion, attrition, solution.", "Transportation: traction, saltation, suspension, solution, longshore drift.", "Landforms of erosion: headlands and bays, wave-cut platforms, caves, arches, stacks, and stumps.", "Management case study (Holderness Coast): rapid erosion (up to 2m/year) due to soft boulder clay and powerful waves. Protected areas: Mappleton (rock groynes, revetments)."] },
                { t: "River Landscapes", points: ["Erosion in upper course: vertical erosion, hydraulic action, abrasion forming V-shaped valleys and waterfalls/gorges.", "Middle/Lower course: lateral erosion, deposition, forming meanders, ox-bow lakes, levees, and floodplains.", "Flood management: hard engineering (dams, embankments, channel straightening) vs soft engineering (flood warnings, afforestation, river restoration)."] }
              ],
              quiz: [
                { q: "Which coastal management strategy involves adding sand to widen the beach naturally?", opts: ["Seawall", "Rip-rap", "Beach nourishment", "Gabions"], ans: 2 }
              ]
            },
            {
              id: "g4",
              name: "Unit 4: Urban Issues and Challenges",
              cards: [
                { q: "What is urbanization?", a: "The increase in the proportion of people living in towns and cities compared to rural areas." },
                { q: "What are push and pull factors in rural-urban migration?", a: "Push factors force people out of rural areas (poverty, crop failure). Pull factors attract them to cities (jobs, healthcare, education)." },
                { q: "What is a megacity?", a: "An urban area with a total population of over 10 million people." }
              ],
              notes: [
                { t: "Lagos, Nigeria (LIC/NEE Urban Case Study)", points: ["Importance: regional commercial hub, former national capital, major seaport, booming Nollywood film industry.", "Opportunities: rapid economic growth, more formal and informal jobs, improved electricity and transport links (BRT systems).", "Challenges: rapid growth of squatter settlements (Makoko), severe traffic congestion ('Go-Slows'), water pollution, lack of sanitation, high crime rates.", "Urban planning: Makoko Floating School project, transport upgrades, slum upgrading initiatives."] },
                { t: "London, UK (HIC Urban Case Study)", points: ["Importance: financial capital of the UK, global cultural hub, transport nexus (Heathrow, Eurostar).", "Opportunities: urban regeneration in East London (Olympic Park, Stratford), ethnic diversity, employment in tertiary and quaternary sectors.", "Challenges: social inequality (wealth gap between Kensington/Chelsea and Newham), housing shortages, dereliction, waste disposal, urban sprawl.", "Urban greening: increasing parks, green roofs, and sustainable urban drainage systems (SUDS)."] }
              ],
              quiz: [
                { q: "What is a megacity defined as having a population of over:", opts: ["1 million", "5 million", "10 million", "50 million"], ans: 2 }
              ]
            },
            {
              id: "g5",
              name: "Unit 5: The Changing Economic World",
              cards: [
                { q: "How is global development measured?", a: "Using economic indicators like GDP per capita and social indicators like the Human Development Index (HDI), literacy rate, and life expectancy." },
                { q: "What is the Demographic Transition Model (DTM)?", a: "A model showing how birth rates and death rates change over time as a country develops through 5 stages." },
                { q: "What is a Transnational Corporation (TNC)?", a: "A large company that operates in multiple countries, with headquarters in HICs and factories/offices in NEEs or LICs." }
              ],
              notes: [
                { t: "Global Development & Inequality", points: ["Causes of uneven development: physical (landlocked, extreme climate, natural disasters), historical (colonialism), economic (unequal trade, debt).", "Strategies to reduce development gap: aid, fair trade, microfinance, investment, industrial development, tourism.", "Nigeria (NEE Case Study): rapid industrialization, role of TNCs (Shell oil extraction), environmental impacts (oil spills in Niger Delta), political and cultural influence in ECOWAS."] },
                { t: "The UK Economy", points: ["Deindustrialization: decline of traditional heavy manufacturing (mining, shipbuilding), growth of post-industrial tertiary (services) and quaternary (IT, research) sectors.", "North-South divide: economic disparities between prosperous southern regions and deindustrialized northern industrial towns.", "UK in the wider world: strong links via trade, Commonwealth, European ties, and digital global telecommunications."] }
              ],
              quiz: [
                { q: "Which composite indicator measures health, education, and wealth combined?", opts: ["GDP per capita", "Birth rate", "Human Development Index (HDI)", "Infant mortality rate"], ans: 2 }
              ]
            },
            {
              id: "g6",
              name: "Unit 6: The Challenge of Resource Management",
              cards: [
                { q: "What are the three essential resources for human survival?", a: "Food, water, and energy." },
                { q: "What is food security?", a: "Having access at all times to sufficient, safe, nutritious food to maintain a healthy and active life." },
                { q: "What is the difference between water surplus and water deficit?", a: "Surplus: precipitation exceeds evaporation. Deficit: demand for water exceeds supply." }
              ],
              notes: [
                { t: "Global Resource Disparities", points: ["Food: consumption is rising globally, but unequal access leads to undernourishment in LICs and obesity/surplus in HICs. Factors affecting supply: climate, pests, conflict, poverty.", "Water: global consumption has surged due to population growth and industrialization. Water insecurity causes water-borne diseases, agricultural failure, and geopolitical conflict.", "Energy: uneven global supply and demand. Fossil fuels dominate, but transitioning to renewable energy (solar, wind, hydroelectric) is critical to combat climate change."] },
                { t: "Sustainable Resource Management (Water Focus)", points: ["UK water demand: high in the South and East (population density, lower rainfall) causing water deficit, while the North and West experience water surplus.", "Water management strategies: transfer schemes (aqueducts), dams and reservoirs, groundwater abstraction management, water meters, and greywater recycling.", "Sustainable food production: organic farming, permaculture, reducing food waste, locally sourced food, and hydroponics."] }
              ],
              quiz: [
                { q: "What is the term for an area where water demand exceeds water supply?", opts: ["Water surplus", "Water deficit", "Aquifer", "Catchment area"], ans: 1 }
              ]
            }
          ]
        }
      };

      function renderHeader() {
        var subHtml = '<button class="subj-btn active">Geography</button>';
        document.getElementById('subjects').innerHTML = subHtml;

        var navHtml = '';
        var tabs = [
          { id: 'study', label: 'Flashcards' },
          { id: 'notes', label: 'Revision Notes' },
          { id: 'quiz', label: 'Practice Quiz' }
        ];
        tabs.forEach(function (t) {
          navHtml += '<button aria-selected="' + (tab === t.id) + '" onclick="setTab(\'' + t.id + '\')">' + t.label + '</button>';
        });
        document.getElementById('tabs').innerHTML = navHtml;
      }

      window.setUnit = function (u) {
        currentUnit = u;
        qIdx = 0;
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        flipped = false;
        render();
      };

      window.setTab = function (t) {
        tab = t;
        flipped = false;
        render();
      };

      function getFilteredUnits() {
        var units = DATA[currentSubj].units;
        if (currentUnit === 'all') return units;
        return units.filter(function (u) { return u.id === currentUnit; });
      }

      function getCards() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.cards.forEach(function (c) {
            list.push({ topic: u.name, q: c.q, a: c.a });
          });
        });
        return list;
      }

      function getQuiz() {
        var list = [];
        getFilteredUnits().forEach(function (u) {
          u.quiz.forEach(function (q) {
            list.push({ topic: u.name, q: q.q, opts: q.opts, ans: q.ans });
          });
        });
        return list;
      }

      function renderUnitSelector() {
        var html = '<div class="filter-bar">';
        html += '<label style="font-size:0.85rem; color:var(--muted); width:100%;">Filter by Unit:';
        html += '<select onchange="setUnit(this.value)">';
        html += '<option value="all" ' + (currentUnit === 'all' ? 'selected' : '') + '>All Units</option>';
        DATA[currentSubj].units.forEach(function (u) {
          html += '<option value="' + u.id + '" ' + (currentUnit === u.id ? 'selected' : '') + '>' + u.name + '</option>';
        });
        html += '</select></label></div>';
        return html;
      }

      function renderStudy() {
        var cards = getCards();
        var html = renderUnitSelector();
        if (cards.length === 0) return html + '<div class="panel">No cards available for this unit.</div>';
        var c = cards[qIdx % cards.length];
        html += '<div class="card" onclick="flipCard()">';
        html += '<div class="topic"><span>' + c.topic + '</span><span>' + (qIdx + 1) + '/' + cards.length + '</span></div>';
        html += '<div class="q">' + c.q + '</div>';
        if (flipped) {
          html += '<div class="ans">' + c.a + '</div>';
        } else {
          html += '<div class="hint">Click to reveal answer</div>';
        }
        html += '</div>';
        html += '<div class="actions">';
        html += '<button class="btn miss" onclick="nextCard(event)">Missed it</button>';
        html += '<button class="btn hit" onclick="nextCard(event)">Got it</button>';
        html += '</div>';
        return html;
      }

      window.flipCard = function () {
        flipped = !flipped;
        render();
      };

      window.nextCard = function (e) {
        e.stopPropagation();
        flipped = false;
        qIdx++;
        render();
      };

      function renderNotes() {
        var html = renderUnitSelector();
        html += '<div class="panel">';
        html += '<h2>' + DATA[currentSubj].title + '</h2>';
        getFilteredUnits().forEach(function (u) {
          html += '<div class="unit-h">' + u.name + '</div>';
          u.notes.forEach(function (n) {
            html += '<div class="note-item"><b>' + n.t + '</b><ul>';
            n.points.forEach(function (p) {
              html += '<li>' + p + '</li>';
            });
            html += '</ul></div>';
          });
        });
        html += '</div>';
        return html;
      }

      function renderQuiz() {
        var quiz = getQuiz();
        var html = renderUnitSelector();
        if (quiz.length === 0) return html + '<div class="panel">No quiz questions available for this unit.</div>';

        if (quizIdx >= quiz.length) {
          html += '<div class="panel" style="text-align:center; padding:30px;">';
          html += '<h2>Quiz Complete!</h2>';
          html += '<p>Score: <b>' + quizScore + ' / ' + quiz.length + '</b></p>';
          html += '<button class="btn primary" onclick="resetQuiz()">Try Again</button>';
          html += '</div>';
          return html;
        }

        var q = quiz[quizIdx];
        html += '<div class="panel">';
        html += '<div class="topic"><span>' + q.topic + '</span><span>Question ' + (quizIdx + 1) + '/' + quiz.length + '</span></div>';
        html += '<div class="q">' + q.q + '</div>';
        html += '<div class="opts">';
        q.opts.forEach(function (opt, idx) {
          var cls = 'opt';
          if (quizSelected !== null) {
            if (idx === q.ans) cls += ' right';
            else if (idx === quizSelected) cls += ' wrong';
          }
          html += '<button class="' + cls + '" ' + (quizSelected !== null ? 'disabled' : '') + ' onclick="selectOpt(' + idx + ')">' + opt + '</button>';
        });
        html += '</div>';

        if (quizSelected !== null) {
          html += '<button class="btn primary" style="margin-top:10px;" onclick="nextQuiz()">Next Question</button>';
        }
        html += '</div>';
        return html;
      }

      window.selectOpt = function (idx) {
        quizSelected = idx;
        if (idx === getQuiz()[quizIdx].ans) quizScore++;
        render();
      };

      window.nextQuiz = function () {
        quizIdx++;
        quizSelected = null;
        render();
      };

      window.resetQuiz = function () {
        quizIdx = 0;
        quizSelected = null;
        quizScore = 0;
        render();
      };

      function render() {
        renderHeader();
        var main = document.getElementById('view');
        if (tab === 'study') main.innerHTML = renderStudy();
        else if (tab === 'notes') main.innerHTML = renderNotes();
        else if (tab === 'quiz') main.innerHTML = renderQuiz();
      }

      render();
    })();
  </script>
</body>
</html>
